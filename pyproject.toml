[project]
name = "code-reviewer"
version = "0.0.0"
description = "CodeReviewer.ai — RAG-powered pull-request reviewer that learns a codebase"
requires-python = ">=3.12"
dependencies = [
    "codereviewer-schemas",
    "codereviewer-db",
    "codereviewer-api",
    "codereviewer-indexer",
    "codereviewer-providers",
    "codereviewer-worker",
    "codereviewer-retrieval",
    "codereviewer-reviewer",
    "codereviewer-github",
]

[tool.uv]
package = false

[tool.uv.workspace]
members = ["libs/*", "services/*"]

[tool.uv.sources]
codereviewer-schemas = { workspace = true }
codereviewer-db = { workspace = true }
codereviewer-api = { workspace = true }
codereviewer-indexer = { workspace = true }
codereviewer-providers = { workspace = true }
codereviewer-worker = { workspace = true }
codereviewer-retrieval = { workspace = true }
codereviewer-reviewer = { workspace = true }
codereviewer-github = { workspace = true }

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "testcontainers>=4.8",
    "httpx>=0.27",
    "mypy>=1.13",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Header", "fastapi.Query", "fastapi.Path", "fastapi.Body", "fastapi.Security"]

[tool.ruff.lint.isort]
known-first-party = ["codereviewer"]

[tool.mypy]
python_version = "3.12"
strict = true
namespace_packages = true
explicit_package_bases = true
mypy_path = ["libs/schemas/src", "libs/db/src", "services/api/src", "libs/indexer/src", "libs/providers/src", "services/worker/src", "libs/retrieval/src", "libs/reviewer/src", "libs/github/src"]

[[tool.mypy.overrides]]
module = "testcontainers.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
addopts = "-ra -m 'not integration'"
testpaths = ["libs", "services"]
asyncio_mode = "auto"
markers = [
    "integration: requires a live database (testcontainers/docker); excluded from the default run",
]
