[project]
name = "codereviewer-worker"
description = "arq background worker for CodeReviewer.ai: indexing and review jobs"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "codereviewer-schemas",
    "codereviewer-db",
    "codereviewer-providers",
    "codereviewer-indexer",
    "codereviewer-retrieval",
    "codereviewer-reviewer",
    "arq>=0.25",
    "redis>=5.0",
    "pydantic-settings>=2.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
