[project]
name = "codereviewer-api"
description = "FastAPI gateway for CodeReviewer.ai: REST, WebSocket, and GitHub webhooks"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]>=0.115",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
