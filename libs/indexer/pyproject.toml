[project]
name = "codereviewer-indexer"
version = "0.0.0"
description = "Repository cloning, file walking, and tree-sitter AST-aware chunking for CodeReviewer.ai"
requires-python = ">=3.12"
dependencies = [
    "codereviewer-schemas",
    "tree-sitter>=0.21.0,<0.22.0",
    "tree-sitter-languages>=1.10.0",
    "tiktoken>=0.7.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
