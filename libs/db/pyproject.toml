[project]
name = "codereviewer-db"
description = "SQLAlchemy 2.0 (async) models and migrations for CodeReviewer.ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "sqlalchemy>=2.0.36",
    "pgvector>=0.3.6",
    "codereviewer-schemas",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]

[tool.uv.sources]
codereviewer-schemas = { workspace = true }
