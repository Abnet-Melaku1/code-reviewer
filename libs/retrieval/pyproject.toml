[project]
name = "codereviewer-retrieval"
description = "Context retrieval, diff parsing, and RAG grounding for CodeReviewer.ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "codereviewer-schemas",
    "codereviewer-db",
    "codereviewer-providers",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
