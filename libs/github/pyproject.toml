[project]
name = "codereviewer-github"
description = "GitHub App client, signature verification, and comment poster for CodeReviewer.ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27.0",
    "pyjwt>=2.4.0",
    "cryptography>=38.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
