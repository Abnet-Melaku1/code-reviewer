[project]
name = "codereviewer-schemas"
version = "0.0.0"
description = "Domain models and shared enums — the source of truth for CodeReviewer.ai"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
