[project]
name = "codereviewer-reviewer"
description = "Pull-request review agent, analyzer registry, and grounding validators for CodeReviewer.ai"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "codereviewer-schemas",
    "codereviewer-db",
    "codereviewer-providers",
    "codereviewer-retrieval",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/codereviewer"]
