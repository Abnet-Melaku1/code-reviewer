# Local development stack: Postgres (with pgvector) + Redis.
# Bring up before running the API/worker or integration tests: `docker compose up -d`.
services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: codereviewer
      POSTGRES_PASSWORD: codereviewer
      POSTGRES_DB: codereviewer
    ports:
      - "15432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U codereviewer -d codereviewer"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
